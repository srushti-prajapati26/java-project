<!DOCTYPE html>
<html>
<head>

    <title>Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-4">

            <h4 class="mb-4">Employee System</h4>

            <a href="index.html" class="btn btn-outline-light w-100 mb-2">
                Dashboard
            </a>

            <a href="employees.html" class="btn btn-outline-light w-100 mb-2">
                Employees
            </a>

            <a href="attendance.html" class="btn btn-outline-light w-100 mb-2">
                Attendance
            </a>

            <a href="leaves.html" class="btn btn-outline-light w-100 mb-2">
                Leaves
            </a>

            <a href="loans.html" class="btn btn-outline-light w-100 mb-2">
                Loans
            </a>

        </div>


        <!-- MAIN CONTENT -->
        <div class="col-md-9 col-lg-10 p-4">

            <div class="d-flex justify-content-between">
                <h2>Dashboard</h2>
                <div>
    <span class="me-3">Admin</span>

    <a href="login.html" class="btn btn-outline-danger btn-sm">
        Logout
    </a>
</div>
            </div>


            <!-- CARDS -->
            <div class="row mt-4">

                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5>Total Employees</h5>
                            <h2>0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5>Present Today</h5>
                            <h2>0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5>On Leave</h5>
                            <h2>0</h2>
                        </div>
                    </div>
                </div>

            </div>


            <!-- RECENT EMPLOYEES -->
            <div class="card shadow-sm mt-4">

                <div class="card-body">

                    <h4>Recent Employees</h4>

                    <p class="text-muted">
                        Employee information will appear here.
                    </p>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
